name: Fetch pokedb ranked teams

# 上位構築記事の収集パイプライン(docs/ranker/derived/README.md)のうち、
# champs.pokedb.tokyo から落とす部分だけを毎日回す。
# 記事本文のダウンロードとLLM抽出はローカル運用のままで、ここには含めない。

on:
  schedule:
    # 20:00 UTC = JST 5:00。他のcron(Cloudflare 18:00 UTC / OP.GG 19:00 UTC)と時間帯を分ける。
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: ranker-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests
      - name: Fetch ranked teams JSON / article search HTML
        run: python scripts/ranker/fetch_pokedb.py --rule single
      # 検索HTMLは1ページ1.5MBあり毎日差分が出るためコミットしない(artifactで参照する)。
      - name: Upload article search HTML
        uses: actions/upload-artifact@v4
        with:
          name: pokedb-html
          path: docs/ranker/pokedb_html/
          retention-days: 14
      - name: Commit JSON if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ranker/s*_ranked_teams.json docs/ranker/derived/articles-index.json
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'chore(ranker): pokedbの上位チームJSONと記事索引を更新'
          git push
